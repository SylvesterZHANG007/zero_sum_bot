<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="title">Magnetic Piston Actuator — Feasibility Instrument v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#f4f5f7;--panel:#fff;--ink:#1b2028;--muted:#69717d;--faint:#8b929c;--rule:#e2e5ea;--rule2:#c8ced6;
  --avail:#2b6f8f;--req:#b5502a;--warn:#b7791f;--ok:#2f7d4f;--bad:#a83232;--focus:#2b6f8f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:13.5px/1.5 "IBM Plex Sans","Noto Sans SC",system-ui,sans-serif;font-variant-numeric:tabular-nums}
html[lang=zh] body{font-family:"Noto Sans SC","IBM Plex Sans",system-ui,sans-serif}
header{display:flex;align-items:baseline;gap:18px;padding:14px 24px;background:var(--panel);border-bottom:1px solid var(--rule)}
header h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
header p{margin:0;color:var(--muted);font-size:12.5px;flex:1}
.lang{flex:none;display:flex;border:1px solid var(--rule2);border-radius:6px;overflow:hidden;align-self:center}
.lang button{border:0;background:#fff;color:var(--muted);font:inherit;font-size:12.5px;padding:5px 11px;cursor:pointer}
.lang button.on{background:var(--ink);color:#fff}
.wrap{display:grid;grid-template-columns:296px minmax(0,1fr)}
aside{background:var(--panel);border-right:1px solid var(--rule);padding:10px 16px 28px;position:sticky;top:0;height:calc(100vh - 49px);overflow-y:auto}
main{padding:16px 24px 56px;min-width:0}
details{border-bottom:1px solid var(--rule);padding:8px 0 10px}
details:last-of-type{border-bottom:0}
summary{list-style:none;cursor:pointer;font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:7px;padding:4px 0;user-select:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"";width:0;height:0;border-left:5px solid var(--faint);border-top:3.5px solid transparent;border-bottom:3.5px solid transparent;transition:transform .15s}
details[open] summary::before{transform:rotate(90deg)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.row.one{grid-template-columns:1fr}.row.three{grid-template-columns:1fr 1fr 1fr}
label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:3px;line-height:1.3}
input[type=text],input[type=number],select{width:100%;height:30px;padding:0 8px;border:1px solid var(--rule2);border-radius:5px;font:inherit;font-size:13px;color:var(--ink);background:#fff}
input:focus,select:focus,button:focus,summary:focus{outline:2px solid var(--focus);outline-offset:1px}
.hint{font-size:11.5px;color:var(--faint);margin:2px 0 4px;line-height:1.45}
.new{display:inline-block;font-size:10px;font-weight:600;color:var(--avail);border:1px solid var(--avail);border-radius:3px;padding:0 4px;margin-left:5px;vertical-align:1px;line-height:1.4}
.check{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:8px 0 2px}
.check input{width:15px;height:15px;margin:0}
.runbar{position:sticky;bottom:0;background:linear-gradient(#fff0,#fff 30%);padding:14px 0 0;margin-top:6px}
button.run{width:100%;height:38px;border:0;border-radius:6px;background:var(--ink);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.run:disabled{opacity:.5;cursor:default}
.status{font-size:12px;color:var(--muted);margin-top:8px;min-height:16px}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:14px 18px 16px;margin-bottom:14px}
.card h2{margin:0;font-size:14.5px;font-weight:600}
.card .sub{color:var(--muted);font-size:12.5px;margin:2px 0 10px}
.card .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.controls{display:flex;gap:6px 14px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.controls select{width:auto;height:28px;font-size:12.5px}
.fric{display:grid;grid-template-columns:1fr 1fr;gap:14px 28px}
.fric .f{display:grid;grid-template-columns:auto 1fr 84px auto;align-items:center;gap:10px;font-size:12.5px}
.fric .f label{margin:0;font-size:12.5px;color:var(--ink);white-space:nowrap}
.fric input[type=range]{width:100%;accent-color:var(--req);margin:0}
.fric input[type=number]{height:28px}
.fric .unit{color:var(--muted);font-size:12px}
.fric .note{grid-column:1/-1;font-size:12px;color:var(--muted);margin-top:-2px}
.verdict{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.verdict div{padding:8px 12px;border-left:3px solid var(--rule2)}
.verdict b{display:block;font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.verdict span{font-size:12px;color:var(--muted)}
.verdict .good{border-color:var(--ok)}.verdict .warn{border-color:var(--warn)}.verdict .bad{border-color:var(--bad)}
canvas{width:100%;height:auto;display:block;cursor:crosshair}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--muted);margin:2px 0 6px}
.legend i{display:inline-block;width:16px;border-top:2px solid;vertical-align:middle;margin-right:5px}
.legend i.d{border-top-style:dashed}
.tblwrap{max-height:440px;overflow:auto;border:1px solid var(--rule);border-radius:6px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
th,td{padding:6px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--rule)}
th{font-weight:600;color:var(--muted);font-size:11.5px;position:sticky;top:0;background:var(--panel);z-index:1;box-shadow:0 1px 0 var(--rule)}
td:first-child,th:first-child{text-align:left}
tbody tr:nth-child(even) td{background:#fafbfc}
tbody tr:hover td{background:#eef4f8}
.tag{display:inline-block;padding:0 7px;border-radius:10px;font-size:11.5px;font-weight:500;line-height:1.6}
.tag.ok{background:#e4f2ea;color:var(--ok)}.tag.no{background:#f8e5e5;color:var(--bad)}.tag.hot{background:#f8eedb;color:var(--warn)}
.notes{font-size:12.5px;color:var(--muted);line-height:1.6}.notes p{margin:0 0 8px}.notes b{color:var(--ink);font-weight:600}
.readout{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.5}.readout b{color:var(--ink);font-weight:600}
.actions{display:flex;gap:10px;margin-top:10px;align-items:center}
.actions button{height:30px;padding:0 12px;border:1px solid var(--rule2);border-radius:5px;background:#fff;font:inherit;font-size:12.5px;cursor:pointer}
.preset{padding:10px 0 10px;border-bottom:1px solid var(--rule)}
.pwinfo{font-size:11.5px;color:var(--muted);line-height:1.45;margin:4px 0 2px}.pwinfo b{color:var(--bad);font-weight:600}
.dyngrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 14px;margin:4px 0 10px}
.dyngrid .check{margin:20px 0 0}
.dynbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:2px 0 12px}
.dynbar button{height:32px;padding:0 16px;border:0;border-radius:6px;background:var(--ink);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.dynbar button:disabled{opacity:.5;cursor:default}
.dynplots{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}
.dynplots h3{margin:8px 0 2px;font-size:12.5px;font-weight:600}
.dynplots .wide{grid-column:1/-1}
.dyntbl{margin-top:12px}
.empty{color:var(--faint);font-size:13px;padding:22px 0;text-align:center;grid-column:1/-1}
@media (max-width:980px){.dyngrid{grid-template-columns:1fr 1fr}.dynplots{grid-template-columns:1fr}.wrap{grid-template-columns:1fr}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--rule)}.verdict,.fric{grid-template-columns:1fr 1fr}header{flex-wrap:wrap;gap:6px}}
@media (max-width:640px){.verdict,.fric{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1 data-i18n="title">Magnetic Piston Actuator — Feasibility Instrument v2</h1>
  <p data-i18n="header.desc"></p>
  <div class="lang" role="group" aria-label="Language"><button id="langEn" class="on">EN</button><button id="langZh">中文</button></div>
</header>

<div class="wrap">
<aside>
  <div class="preset"><label for="preset" data-i18n="lbl.preset"></label><select id="preset"><option value="bench" data-i18n="opt.preset.bench"></option><option value="alex" data-i18n="opt.preset.alex"></option><option value="custom" data-i18n="opt.preset.custom"></option></select></div>
  <details open><summary data-i18n="sec.bore"></summary>
    <div class="row three">
      <div><label data-i18n="lbl.rmin"></label><input id="rmin" type="number" step="0.5" value="2.5"></div>
      <div><label data-i18n="lbl.rmax"></label><input id="rmax" type="number" step="0.5" value="15"></div>
      <div><label data-i18n="lbl.pts"></label><input id="rn" type="number" step="1" value="6"></div>
    </div>
    <div class="row one">
      <div><label data-i18n="lbl.stroke"></label><div style="display:flex;gap:6px"><input id="stroke" type="number" step="1" value="200" style="flex:1;min-width:0"><select id="strokeUnit" style="width:72px;flex:none"><option value="mm">mm</option><option value="uL">µL</option></select></div></div>
    </div>
    <div class="row">
      <div><label data-i18n="lbl.lgas"></label><input id="lgas" type="number" step="1" value="200"></div>
      <div><label data-i18n="lbl.vdead"></label><input id="vdead" type="number" step="0.1" value="0"></div>
    </div>
    <div class="row one">
      <div><label data-i18n="lbl.mode"></label><select id="mode"><option value="single" data-i18n="opt.single"></option><option value="twosided" data-i18n="opt.twosided"></option></select></div>
    </div>
    <div class="row one" id="preRow" style="display:none"><div><label data-i18n="lbl.wpre"></label><input id="wpre" type="number" step="0.5" value="5"></div></div>
    <p class="hint" data-i18n="hint.bore"></p>
  </details>

  <details open><summary data-i18n="sec.coil"></summary>
    <div class="row one"><div><label data-i18n="lbl.spec"></label><select id="coilSpec"><option value="prewound" data-i18n="opt.spec.prewound"></option><option value="layers" data-i18n="opt.spec.layers"></option><option value="turns" data-i18n="opt.spec.turns"></option></select></div></div>
    <div id="pwBox">
      <div class="row three">
        <div><label data-i18n="lbl.pwID"></label><input id="pwID" type="number" step="0.1" value="10"></div>
        <div><label data-i18n="lbl.pwH"></label><input id="pwH" type="number" step="0.5" value="20"></div>
        <div><label data-i18n="lbl.pwOD"></label><input id="pwOD" type="number" step="0.5" value="35"></div>
      </div>
      <div class="row three">
        <div><label data-i18n="lbl.pwN"></label><input id="pwN" type="number" step="10" value="1000"></div>
        <div><label data-i18n="lbl.pwWire"></label><input id="pwWire" type="number" step="0.01" value="0.35"></div>
        <div><label data-i18n="lbl.pwBare"></label><input id="pwBare" type="number" step="0.01" value="0.32"></div>
      </div>
      <div class="row three">
        <div><label data-i18n="lbl.pwFl"></label><input id="pwFl" type="number" step="0.1" value="1.0"></div>
        <div><label data-i18n="lbl.pwBob"></label><input id="pwBob" type="number" step="0.1" value="0.5"></div>
        <div><label data-i18n="lbl.pwR"></label><input id="pwR" type="number" step="0.1" value="13.0"></div>
      </div>
      <div class="pwinfo" id="pwInfo"></div>
      <p class="hint" data-i18n="hint.pw"></p>
    </div>
    <div class="row" id="gaugeRow">
      <div><label data-i18n="lbl.awg"></label><select id="awg"><option>26</option><option>28</option><option>30</option><option>32</option><option>34</option><option selected>36</option><option>38</option><option>40</option></select></div>
      <div id="layersBox"><label data-i18n="lbl.layers"></label><input id="layers" type="text" value="1, 4, 8, 14"></div>
      <div id="turnsBox" style="display:none"><label data-i18n="lbl.turns"></label><input id="turnsList" type="text" value="2000, 4000, 6000, 7100"></div>
    </div>
    <div class="row">
      <div><label data-i18n="lbl.pitch"></label><input id="pitch" type="number" step="1" value="0"></div>
      <div><label data-i18n="lbl.comm"></label><select id="comm"><option value="ahead" data-i18n="opt.comm.ahead"></option><option value="pushpull" data-i18n="opt.comm.pushpull"></option><option value="step" data-i18n="opt.comm.step"></option></select></div>
    </div>
    <div class="row">
      <div><label data-i18n="lbl.drive"></label><select id="drive"><option value="current" data-i18n="opt.drive.current"></option><option value="supply" data-i18n="opt.drive.supply"></option></select></div>
      <div id="supBox"><label data-i18n="lbl.supV"></label><input id="supV" type="number" step="0.5" value="10"></div>
    </div>
    <div class="row">
      <div><label><span id="lblCur" data-i18n="lbl.current"></span><span id="lblLim" data-i18n="lbl.ilim"></span></label><input id="current" type="number" step="0.1" value="4.0"></div>
      <div id="ovBox"><label data-i18n="lbl.overlap"></label><input id="overlap" type="number" step="1" value="2"></div>
    </div>
    <div class="row three">
      <div><label data-i18n="lbl.dtmax"></label><input id="dtmax" type="number" step="5" value="40"></div>
      <div><label data-i18n="lbl.h"></label><input id="hconv" type="number" step="1" value="15"></div>
      <div><label data-i18n="lbl.duty"></label><input id="duty" type="number" step="0.05" value="1.0"></div>
    </div>
    <label class="check"><input id="clamp" type="checkbox"> <span data-i18n="chk.clamp"></span></label>
    <p class="hint" data-i18n="hint.coil"></p>
  </details>

  <details open><summary data-i18n="sec.magnet"></summary>
    <div class="row">
      <div><label data-i18n="lbl.br"></label><input id="br" type="number" step="0.01" value="1.48"></div>
      <div><label data-i18n="lbl.lmag"></label><input id="lmag" type="text" value="3.2, 6.35, 9.5, 12.7"></div>
    </div>
    <div class="row three">
      <div><label data-i18n="lbl.clear"></label><input id="clear" type="number" step="0.05" value="0"></div>
      <div><label data-i18n="lbl.gap"></label><input id="gap" type="number" step="0.05" value="0.25"></div>
      <div><label data-i18n="lbl.wall"></label><input id="wall" type="number" step="0.1" value="1.0"></div>
    </div>
    <p class="hint" data-i18n="hint.magnet"></p>
  </details>

  <details open><summary data-i18n="sec.endcap"></summary>
    <div class="row">
      <div><label data-i18n="lbl.a"></label><input id="a" type="number" step="0.5" value="25"></div>
      <div><label data-i18n="lbl.t"></label><input id="t" type="number" step="0.05" value="2.5"></div>
    </div>
    <div class="row">
      <div><label data-i18n="lbl.mu"></label><input id="mu" type="number" step="0.1" value="59.8"></div>
      <div><label data-i18n="lbl.jm"></label><input id="jm" type="number" step="0.1" value="16.92"></div>
    </div>
  </details>

  <details><summary data-i18n="sec.num"></summary>
    <div class="row three">
      <div><label data-i18n="lbl.slices"></label><input id="slices" type="number" step="1" value="30"></div>
      <div><label data-i18n="lbl.npro"></label><input id="npro" type="number" step="1" value="161"></div>
      <div><label data-i18n="lbl.nx"></label><input id="nx" type="number" step="1" value="180"></div>
    </div>
    <p class="hint" data-i18n="hint.num"></p>
  </details>

  <div class="runbar">
    <button class="run" id="run" data-i18n="btn.run"></button>
    <div class="status" id="status"></div>
  </div>
</aside>

<main>
  <section class="card">
    <div class="head"><div><h2 data-i18n="fric.title"></h2><p class="sub" data-i18n="fric.sub"></p></div></div>
    <div class="fric">
      <div class="f"><label data-i18n="fric.k0"></label><input id="k0s" type="range" min="0" max="3" step="0.01" value="0"><input id="k0" type="number" min="0" step="0.01" value="0"><span class="unit">N</span></div>
      <div class="f"><label data-i18n="fric.kc"></label><input id="kcs" type="range" min="0" max="0.5" step="0.005" value="0"><input id="kc" type="number" min="0" step="0.005" value="0"><span class="unit">N/mm</span></div>
      <div class="note" data-i18n="fric.note"></div>
    </div>
  </section>

  <section class="card">
    <h2 data-i18n="verdict.title"></h2>
    <p class="sub" data-i18n="verdict.sub"></p>
    <div class="verdict" id="verdict"><div class="empty" data-i18n="verdict.empty"></div></div>
  </section>

  <section class="card">
    <div class="head"><div><h2 data-i18n="p1.title"></h2><p class="sub" data-i18n="p1.sub"></p></div>
      <div class="controls"><span><span data-i18n="ctl.coil"></span> <select id="p1Lay"></select></span><span><span data-i18n="ctl.magnet"></span> <select id="p1Len"></select></span></div></div>
    <div class="legend" id="leg1"></div>
    <canvas id="c1" width="1100" height="420"></canvas>
    <div class="readout" id="giveback"></div>
  </section>

  <section class="card">
    <div class="head"><div><h2><span data-i18n="p2.title"></span> <span class="new" data-i18n="tag.new"></span></h2><p class="sub" data-i18n="p2.sub"></p></div>
      <div class="controls"><span><span data-i18n="ctl.coil"></span> <select id="p2Lay"></select></span><span><span data-i18n="ctl.magnet"></span> <select id="p2Len"></select></span></div></div>
    <div class="legend" id="leg2"></div>
    <canvas id="c2" width="1100" height="330"></canvas>
    <div class="readout" id="rstar"></div>
  </section>

  <section class="card">
    <div class="head"><div><h2 data-i18n="p3.title"></h2><p class="sub" data-i18n="p3.sub"></p></div>
      <div class="controls"><span><span data-i18n="ctl.radius"></span> <select id="p3R"></select></span><span><span data-i18n="ctl.magnet"></span> <select id="p3Len"></select></span></div></div>
    <div class="legend" id="leg3"></div>
    <canvas id="c3" width="1100" height="360"></canvas>
  </section>

  <section class="card" id="dynCard">
    <div class="head"><div><h2><span data-i18n="dyn.title"></span> <span class="new" data-i18n="tag.new"></span></h2><p class="sub" data-i18n="dyn.sub"></p></div></div>
    <div class="dyngrid">
      <div><label data-i18n="dyn.mode"></label><select id="dynMode"><option value="step" data-i18n="opt.dyn.step"></option><option value="pushpull" data-i18n="opt.dyn.pushpull"></option><option value="ahead" data-i18n="opt.dyn.ahead"></option></select></div>
      <div><label data-i18n="dyn.n"></label><input id="dynN" type="number" step="1" min="2" value="2"></div>
      <div><label data-i18n="dyn.V"></label><input id="dynV" type="text" value="5, 7.5, 10, 12.5, 15"></div>
      <div><label data-i18n="dyn.ilim"></label><input id="dynIlim" type="number" step="0.1" value="1.0"></div>
      <div><label data-i18n="dyn.mu"></label><input id="dynMu" type="number" step="0.05" value="0.3"></div>
      <div><label data-i18n="dyn.steps"></label><input id="dynSteps" type="number" step="1" min="1" value="2"></div>
      <div><label data-i18n="dyn.ton"></label><input id="dynTon" type="number" step="10" min="0" value="0"></div>
      <div><label data-i18n="dyn.mass"></label><input id="dynMass" type="number" step="0.1" min="0" value="0"></div>
      <div><label data-i18n="dyn.L"></label><input id="dynL" type="number" step="0.5" min="0" value="0"></div>
      <div><label data-i18n="dyn.tmax"></label><input id="dynTmax" type="number" step="1" min="0.1" value="6"></div>
      <div><label data-i18n="dyn.win"></label><select id="dynWin"><option value="first" data-i18n="opt.win.first"></option><option value="all" data-i18n="opt.win.all"></option></select></div>
      <label class="check"><input id="dynEmf" type="checkbox" checked> <span data-i18n="dyn.emf"></span></label>
    </div>
    <div class="dynbar"><button id="dynRun" data-i18n="dyn.run"></button><span class="readout" id="dynStatus" style="margin:0"></span></div>
    <div class="readout" id="dynSum"></div>
    <div class="dynplots">
      <div class="wide"><h3 data-i18n="dyn.p1"></h3><div class="legend" id="dynLeg"></div><canvas id="d1" width="1100" height="300"></canvas></div>
      <div><h3 data-i18n="dyn.p2"></h3><canvas id="d2" width="560" height="270"></canvas></div>
      <div><h3 data-i18n="dyn.p3"></h3><canvas id="d3" width="560" height="270"></canvas></div>
      <div><h3 data-i18n="dyn.p4"></h3><canvas id="d4" width="560" height="270"></canvas></div>
      <div><h3 data-i18n="dyn.p5"></h3><canvas id="d5" width="560" height="270"></canvas></div>
    </div>
    <div class="tblwrap dyntbl"><table id="dynTbl"><thead><tr id="dynHead"></tr></thead><tbody></tbody></table></div>
    <p class="readout" data-i18n="dyn.note"></p>

<script>
/* ============ compute core (validated against Python reference) ============ */
const MU0=4*Math.PI*1e-7, RHO_CU=1.72e-8, P_ATM=101325;
const AWG_BARE={26:0.405e-3,28:0.321e-3,30:0.255e-3,32:0.202e-3,34:0.160e-3,36:0.127e-3,38:0.101e-3,40:0.0799e-3}, INS=1.085;
function ellipKE(m){if(m<=0)return{K:Math.PI/2,E:Math.PI/2};if(m>=1)m=1-1e-14;let a=1,b=Math.sqrt(1-m),c=Math.sqrt(m),sum=.5*c*c,p=1;for(let i=0;i<40;i++){const an=.5*(a+b),bn=Math.sqrt(a*b);c=.5*(a-b);p*=2;sum+=.5*p*c*c;a=an;b=bn;if(c<1e-15)break;}const K=Math.PI/(2*a);return{K,E:K*(1-sum)};}
function Mloop(a,b,d){const m=4*a*b/((a+b)*(a+b)+d*d),k=Math.sqrt(m),{K,E}=ellipKE(m);return MU0*Math.sqrt(a*b)*((2/k-k)*K-(2/k)*E);}
function makeCoil(rBore,lMag,awg,layers,wall,gap,slices,pitchOverride){const wire=pitchOverride||AWG_BARE[awg]*INS,Rin=rBore+wall+gap,tpl=Math.max(1,Math.floor(lMag/wire)),N=tpl*layers,Rl=[];for(let j=0;j<layers;j++)Rl.push(Rin+(j+.5)*wire);const Rout=Rin+layers*wire,z=[],tpn=tpl/slices;for(let s=0;s<slices;s++)z.push(-lMag/2+(s+.5)*lMag/slices);const Aw=Math.PI*AWG_BARE[awg]**2/4;let wl=0;for(const r of Rl)wl+=tpl*2*Math.PI*r;const Relec=RHO_CU*wl/Aw,Asurf=2*Math.PI*Rout*lMag+2*Math.PI*(Rout*Rout-Rin*Rin);return{Rin,Rout,Rl,z,tpn,N,nAxial:N/lMag,Relec,Asurf,length:lMag,layers};}
function fluxUnit(c,rD,zD){let t=0;for(const R of c.Rl)for(const zs of c.z)t+=Mloop(R,rD,zD-zs);return t*c.tpn;}
function forceUnit(c,Br,rM,lM,z){return(Br/MU0)*(fluxUnit(c,rM,z+lM/2)-fluxUnit(c,rM,z-lM/2));}
function localProfile(c,Br,rM,lM,span,n){const half=Math.floor(n/2),zs=[],F=[];for(let i=0;i<=half;i++){const z=span*i/half;zs.push(z);F.push(forceUnit(c,Br,rM,lM,z));}const Z=[],FF=[];for(let i=half;i>=1;i--){Z.push(-zs[i]);FF.push(-F[i]);}for(let i=0;i<=half;i++){Z.push(zs[i]);FF.push(F[i]);}return{z:Z,F:FF,span};}
function interp(p,z){if(z<=-p.span||z>=p.span)return 0;const n=p.z.length,t=(z+p.span)/(2*p.span)*(n-1),i=Math.min(n-2,Math.floor(t)),f=t-i;return p.F[i]*(1-f)+p.F[i+1]*f;}
function availableCurve(p,I,pitch,ov,xs){return xs.map(x=>{const k0=Math.floor(x/pitch)+1;let f=0;for(let k=k0;k<k0+ov;k++)f+=Math.abs(interp(p,x-k*pitch));return f*I;});}
function gentCap(w,a,t,mu,Jm){if(w<=0)return 0;const b=w/a,l2=1+b*b,I1=2*l2+1/(l2*l2),den=Jm-(I1-3);if(den<=1e-9)return Infinity;return(4*mu*t/a)*b*(l2-1/(l2*l2))/(l2*l2)*(Jm/den);}
function capVol(w,a){return Math.PI*w*(3*a*a+w*w)/6;}
function chamber(V0,dV,a,t,mu,Jm,wPre){   const Vpre=capVol(wPre,a), Vfree=V0-dV-Vpre;   let lo2=1,hi2=1+Jm; for(let i=0;i<60;i++){const m=.5*(lo2+hi2);(2*m+1/(m*m)-3<Jm)?lo2=m:hi2=m;} const wLock=a*Math.sqrt(Math.max(lo2-1,1e-12));   let wl=-6*a,wh=wLock; for(let i=0;i<60;i++){const m=.5*(wl+wh);(Vfree+capVol(m,a)<=1e-4*V0)?wl=m:wh=m;} const wMin=wh;   const gas=w=>P_ATM*V0/(Vfree+capVol(w,a))-P_ATM;   const memb=w=>w>=0?gentCap(w,a,t,mu,Jm):-gentCap(-w,a,t,mu,Jm);   const res=w=>gas(w)-memb(w);   let lo=wMin,hi=0.999*wLock,flo=res(lo),fhi=res(hi);   if(!(flo>0)||!(fhi<0)){ return {p:Infinity,w0:hi,burst:true}; }   for(let i=0;i<80;i++){const mid=.5*(lo+hi),fm=res(mid);if(fm>0){lo=mid;flo=fm;}else hi=mid;}   const w=.5*(lo+hi); return {p:memb(w),w0:w,burst:false}; }
function requiredCurve(mode,r,xs,mb,Lgas,Vdead,wPre){const A=Math.PI*r*r;return xs.map(x=>{if(mode==='single'){const c=chamber(A*Lgas+Vdead,A*x,mb.a,mb.t,mb.mu,mb.Jm,0);return{F:c.p*A,p:c.p,w0:c.w0};}const V0=A*Lgas/2+Vdead/2,ca=chamber(V0,A*x,mb.a,mb.t,mb.mu,mb.Jm,wPre),cb=chamber(V0,-A*x,mb.a,mb.t,mb.mu,mb.Jm,wPre);return{F:(ca.p-cb.p)*A,p:ca.p,w0:ca.w0};});}

/* ---- v3: catalogue (pre-wound) coil. Inner radius and length come from the part; with a measured
   resistance the layer spacing is fitted so the mean turn radius reproduces it. ---- */
function makePrewound(p,slices){
  const Rin=p.ID/2+p.bob,Lw=Math.max(1e-4,p.H-2*p.fl),tpl=Math.max(1,Math.floor(Lw/p.wire)),layers=Math.max(1,Math.ceil(p.N/tpl)),Aw=Math.PI*p.bare*p.bare/4;
  let dr=p.wire,cal=false;
  if(p.Rmeas>0){const Rm=p.Rmeas*Aw/(RHO_CU*p.N*2*Math.PI),d=2*(Rm-Rin)/layers;if(d>0){dr=d;cal=true;}}
  const Rl=[];for(let j=0;j<layers;j++)Rl.push(Rin+(j+.5)*dr);
  const z=[];for(let s=0;s<slices;s++)z.push(-Lw/2+(s+.5)*Lw/slices);
  let wl=0;for(const r of Rl)wl+=(p.N/layers)*2*Math.PI*r;
  const Rout=Rin+layers*dr,Ro=p.OD/2,ri=p.ID/2;
  const c={Rin,Rout,Rl,z,tpn:(p.N/layers)/slices,N:p.N,nAxial:p.N/Lw,Relec:RHO_CU*wl/Aw,Asurf:2*Math.PI*Ro*p.H+2*Math.PI*(Ro*Ro-ri*ri),length:Lw,layers,tpl,dr,cal,overOD:Rout>Ro+1e-9,boreMax:ri};
  c.Lind=wheeler(c);return c;
}
// Wheeler's multilayer inductance estimate (H); dimensions in metres.
function wheeler(c){const r=(c.Rin+c.Rout)/2,d=c.Rout-c.Rin;return 31.6*c.N*c.N*r*r/(6*r+9*c.length+10*d)*1e-6;}
// Available forward force along the stroke for three switching schemes.
//  ahead   : the `ov` nearest coils ahead attract (original rule)
//  pushpull: any coil may attract or repel; the `ov` coils with the largest pull are used
//  step    : only the next coil ahead is on
function availableCurve2(p,I,pitch,ov,xs,mode){
  return xs.map(x=>{
    if(mode==='pushpull'){const k0=Math.floor(x/pitch),fs=[];for(let k=k0-ov-1;k<=k0+ov+1;k++)fs.push(Math.abs(interp(p,x-k*pitch)));fs.sort((a,b)=>b-a);let f=0;for(let i=0;i<ov&&i<fs.length;i++)f+=fs[i];return f*I;}
    const n=mode==='step'?1:ov,k0=Math.floor(x/pitch)+1;let f=0;for(let k=k0;k<k0+n;k++)f+=Math.abs(interp(p,x-k*pitch));return f*I;});
}
/* ---- v3: time-domain run. m·a = Σ s_k I_k f(x−x_k) − friction; each coil V = IR + L dI/dt + e,
   e = s_k f(x−x_k)·v; CV/CC supply that cannot sink current; flyback diode when off. ---- */
function simulateRun(o){
  const {prof,xc,R,L,V,Ilim,m,mu,emf,mode,Ton,steps,tmax}=o,dt=2e-6,n=xc.length,Ff=mu*m*9.81;
  const f=z=>interp(prof,z),dec=Math.exp(-R*dt/Math.max(L,1e-12));
  let x=xc[0],v=0,t=0;const I=new Array(n).fill(0),on=new Array(n).fill(0),kk=new Array(n).fill(0);
  const seq=[];if(mode==='step'){let k=0,dir=1;for(let i=0;i<steps;i++){if(k+dir<0||k+dir>n-1)dir=-dir;k+=dir;seq.push(k);}on[seq[0]]=1;}
  let si=0,stepStart=0,settledSince=-1,Ein=0,done=false;const every=50,log=[],events=[];let it=0;
  const target=()=>mode==='step'?xc[seq[Math.min(si,seq.length-1)]]:xc[n-1];
  while(t<tmax&&!done){
    if(mode!=='step'){for(let k=0;k<n;k++)on[k]=0;let ah=-1,bh=-1;for(let k=0;k<n;k++){if(xc[k]>x+1e-9&&(ah<0||xc[k]<xc[ah]))ah=k;if(xc[k]<=x+1e-9&&(bh<0||xc[k]>xc[bh]))bh=k;}
      if(ah<0)on[n-1]=1;else{on[ah]=1;if(mode==='pushpull'&&bh>=0)on[bh]=-1;}}
    let F=0;for(let k=0;k<n;k++){kk[k]=f(x-xc[k]);if(on[k])F+=on[k]*I[k]*kk[k];}
    for(let k=0;k<n;k++){
      if(on[k]){const e=emf?on[k]*kk[k]*v:0,Iss=(V-e)/R;let In=Iss+(I[k]-Iss)*dec;if(In>Ilim)In=Ilim;if(In<0)In=0;I[k]=In;Ein+=V*In*dt;}
      else if(I[k]>0){const Iss=-(0.7+Math.abs(emf?kk[k]*v:0))/R;I[k]=Math.max(0,Iss+(I[k]-Iss)*dec);}
    }
    let a;if(Math.abs(v)<1e-5&&Math.abs(F)<=Ff){a=0;v=0;}else a=(F-Ff*Math.sign(Math.abs(v)<1e-5?F:v))/m;
    const vn=v+a*dt;if(v!==0&&Math.sign(vn)!==Math.sign(v)&&Math.abs(F)<=Ff)v=0;else v=vn;
    x+=v*dt;t+=dt;
    if(it++%every===0){let It=0;for(let k=0;k<n;k++)It+=I[k];log.push([t,x,v,a,F,It]);}
    const tg=target(),settled=Math.abs(x-tg)<0.3e-3&&Math.abs(v)<5e-3;
    let next=false;
    if(mode==='step'&&Ton>0)next=t-stepStart>=Ton;
    else{if(settled){if(settledSince<0)settledSince=t;if(t-settledSince>=0.02)next=true;}else settledSince=-1;}
    if(next){events.push({t,dur:t-stepStart});if(mode!=='step'){done=true;break;}on[seq[si]]=0;si++;if(si>=seq.length){done=true;break;}on[seq[si]]=1;stepStart=t;settledSince=-1;}
  }
  return {log,events,Ein,seq,completed:done};
}

function compute(){
  const t0=performance.now();

  const radii=[];for(let i=0;i<rn;i++)radii.push(rn===1?rmin:rmin+(rmax-rmin)*i/(rn-1));
  const strokeIn=num('stroke'),strokeUnit=$('strokeUnit').value,Lgas=num('lgas')*1e-3,Vdead=num('vdead')*1e-6,mode=$('mode').value,wPre=num('wpre')*1e-3;
  const awg=parseInt($('awg').value),coilSpec=$('coilSpec').value,variants=coilSpec==='prewound'?[1]:coilSpec==='turns'?list('turnsList'):list('layers').map(Math.round),I0=num('current'),comm=$('comm').value,ov=comm==='step'?1:Math.max(1,Math.round(num('overlap')));
  const drive=$('drive').value,supV=num('supV'),pitchIn=(num('pitch')||0)*1e-3,pw=coilSpec==='prewound'?readPw():null;
  const dTmax=num('dtmax'),h=num('hconv'),duty=num('duty'),clamp=$('clamp').checked;

function applyFriction(){

  let bi=0;for(let i=1;i<m.length;i++)if(m[i]>m[bi])bi=i;
  const S=[{x:rs,y:m0,color:'#9aa1ab',dash:true,label:t('s.without'),snap:true},{x:rs,y:m,color:'#1b2028',width:2.2,points:true,label:t('s.with'),snap:true,marker:[[rs[bi],m[bi],`r* ≈ ${rs[bi].toFixed(1)} mm`]]}];
  $('leg2').innerHTML=legendHTML([{color:'#1b2028',label:t('lg.with')},{color:'#9aa1ab',dash:true,label:t('lg.without')}]);
  plot($('c2'),S,t('x.radius'),t('y.margin'),{yzero:true,xfmt:x=>x.toFixed(1)+' mm',yfmt:y=>(y>=0?'+':'')+y.toFixed(3)+' N'});
  const edge=(bi===0||bi===rs.length-1)&&rs.length>1,nf=Number.isFinite(m[bi]);
  $('rstar').innerHTML=nf?t('rstar',{coil:coilLabel(v),lm:(lm*1e3).toFixed(2),r:rs[bi].toFixed(1),m:(m[bi]>=0?'+':'')+m[bi].toFixed(2)})+(edge?t('rstar.edge'):'')+(R.fric.k0===0&&R.fric.kc===0?t('rstar.nofric'):t('rstar.fric',{k0:R.fric.k0,kc:R.fric.kc})):'';
}
function draw3(){
  const R=RES,r=parseFloat($('p3R').value),lm=parseFloat($('p3Len').value),xs=R.xsByR[r].map(x=>x*1e3),S=[{x:xs,y:R.req[r].F,color:'#1b2028',width:2.2,label:t('s.req')}],Lg=[{color:'#1b2028',label:t('lg.reqfull')}];
  R.variants.forEach((v,i)=>{const c=cfg(r,lm,v);if(!c)return;const tt=R.variants.length>1?i/(R.variants.length-1):.5;S.push({x:xs,y:c.av,color:ramp(tt,'a'),label:coilLabel(v)});Lg.push({color:ramp(tt,'a'),label:t('lg.avv',{coil:coilLabel(v)})});});
  $('leg3').innerHTML=legendHTML(Lg);plot($('c3'),S,t('x.disp'),t('y.force'),{y0:true,xfmt:x=>x.toFixed(2)+' mm',yfmt:y=>y.toFixed(3)+' N'});
}
function table(){
  const R=RES,s=$('tblSort').value,rows=[...R.configs];
  if(s==='margin')rows.sort((a,b)=>(isFinite(b.worst)?b.worst:-1e9)-(isFinite(a.worst)?a.worst:-1e9));else if(s==='power')rows.sort((a,b)=>a.P-b.P);
  $('tbl').querySelector('tbody').innerHTML=rows.map(o=>`<tr><td>${(o.r*1e3).toFixed(1)} mm (Ø${(o.r*2e3).toFixed(1)})</td><td>${(o.lm*1e3).toFixed(2)} mm</td><td>${coilLabel(o.v)}</td><td>${o.n.toFixed(0)}</td><td>${o.N}</td><td>${fmt(o.R,2)}</td><td>${fmt(o.I,2)}</td><td>${fmt(o.P,1)}</td><td>${fmt(o.dT,0)}</td><td>${fmt(o.Imax,2)}</td><td>${o.worst>=0?'+':''}${fmt(o.worst,2)}</td><td>${fmt(o.xw*1e3,1)}</td><td>${fmt(o.pend/1e3,1)}</td><td><span class="tag ${o.feas?'ok':'no'}">${!o.fits?t('nofit'):o.feas?t('yes'):t('no')}</span></td><td><span class="tag ${o.therm?'ok':'hot'}">${o.therm?t('ok'):t('over')}</span></td></tr>`).join('');
  $('tblnote').textContent=t('tbl.note',{n:rows.length,k0:R.fric.k0,kc:R.fric.kc});
}
$('csv').addEventListener('click',()=>{if(!RES)return;const h='radius_mm,diameter_mm,magnet_mm,coil,turns_per_m,N,R_ohm,I_A,P_W,dT_K,Imax_A,worst_margin_N,at_x_mm,p_end_kPa,feasible,thermal_ok,friction_k0_N,friction_c_N_per_mm\n';
  const b=RES.configs.map(o=>[o.r*1e3,o.r*2e3,o.lm*1e3,o.v,o.n,o.N,o.R,o.I,o.P,o.dT,o.Imax,o.worst,o.xw*1e3,o.pend/1e3,o.feas,o.therm,RES.fric.k0,RES.fric.kc].map(v=>typeof v==='number'?+v.toPrecision(6):v).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h+b],{type:'text/csv'}));a.download='zero_sum_feasibility.csv';a.click();});
for(const id of['p1Lay','p1Len'])$(id).addEventListener('change',draw1);
for(const id of['p2Lay','p2Len'])$(id).addEventListener('change',draw2);
for(const id of['p3R','p3Len'])$(id).addEventListener('change',draw3);
$('tblSort').addEventListener('change',table);
$('run').addEventListener('click',run);
/* ---- v3: dynamics panel ---- */
function dynSetup(){
  const coilSpec=$('coilSpec').value,slices=Math.max(6,Math.round(num('slices')));
  const r=num('rmin')*1e-3,lm=list('lmag')[0]*1e-3,Br=num('br'),clear=num('clear')*1e-3,wall=num('wall')*1e-3,gap=num('gap')*1e-3,awg=parseInt($('awg').value);
  if(!(lm>0))throw new Error('magnet length');
  const pw=coilSpec==='prewound'?readPw():null;
  const coil=pw?makePrewound(pw,slices):coilSpec==='turns'?makeCoil(r,lm,awg,1,wall,gap,slices,1/list('turnsList')[0]):makeCoil(r,lm,awg,Math.round(list('layers')[0]),wall,gap,slices);
  if(pw&&r+wall>pw.ID/2+1e-12)throw new Error(t('nofit'));
  const pitch=(num('pitch')||0)>0?num('pitch')*1e-3:coil.length,n=Math.max(2,Math.round(num('dynN')));
  const rMag=Math.max(1e-4,r-clear),Lmh=num('dynL')||0,L=Lmh>0?Lmh*1e-3:(coil.Lind||wheeler(coil));
  const mass=(num('dynMass')||0)>0?num('dynMass')*1e-3:Math.PI*rMag*rMag*lm*7500;
  const span=n*pitch+coil.length+lm,npts=Math.min(2001,Math.round(2*span/0.1e-3))|1;
  const prof=localProfile(coil,Br,rMag,lm,span,npts);
  const xc=[];for(let k=0;k<n;k++)xc.push(k*pitch);
  return{coil,pitch,n,rMag,r,lm,L,mass,prof,xc,R:coil.Relec};
}
function runDyn(){const b=$('dynRun');b.disabled=true;$('dynStatus').textContent=t('dyn.busy');
  setTimeout(()=>{try{const t0=performance.now();computeDyn();$('dynStatus').textContent=t('dyn.done',{dt:((performance.now()-t0)/1000).toFixed(1)});}catch(e){$('dynStatus').textContent=t('status.err')+e.message;console.error(e);}b.disabled=false;},20);}
function computeDyn(){
  const S=dynSetup(),Vs=list('dynV'),Ilim=num('dynIlim'),mu=num('dynMu'),mode=$('dynMode').value,steps=Math.max(1,Math.round(num('dynSteps'))),Ton=(num('dynTon')||0)*1e-3,tmax=Math.max(0.1,num('dynTmax')),emf=$('dynEmf').checked;
  if(!Vs.length)throw new Error(t('dyn.V'));
  const runs=Vs.map(V=>{
    const res=simulateRun({prof:S.prof,xc:S.xc,R:S.R,L:S.L,V,Ilim,m:S.mass,mu,emf,mode,Ton,steps,tmax});
    const Iss=Math.min(V/S.R,Ilim),x1=S.xc[1],lg=res.log;
    let tc=NaN,Fa=0,aa=0,vmax=0,xmax=-Infinity;const tEnd1=mode==='step'&&res.events.length?res.events[0].t:Infinity;
    for(const q of lg){if(isNaN(tc)){if(q[1]>=x1)tc=q[0];else{Fa=Math.max(Fa,q[4]);aa=Math.max(aa,q[3]);}}vmax=Math.max(vmax,Math.abs(q[2]));if(q[0]<=tEnd1)xmax=Math.max(xmax,q[1]);}
    const xo=xmax-(mode==='step'?x1:S.xc[S.n-1]);
    let pk=0;for(const F of S.prof.F)pk=Math.max(pk,Math.abs(F));
    const startF=Math.abs(interp(S.prof,-S.pitch))*Iss;
    const nEv=res.events.length,settle=nEv?res.events.reduce((a,e)=>a+e.dur,0)/nEv:NaN;
    return{V,Iss,cc:V/S.R>Ilim,peak:pk*Iss,startF,Fa,aa,tc,vmax,xo,settle,complete:res.completed,E:nEv?res.Ein/nEv:NaN,P:Iss*Iss*S.R,log:res.log};
  });
  DYN={S,runs,mode,mu,Ilim};drawDyn();
}
function drawDyn(){
  const D=DYN,S=D.S,N=D.runs.length,col=i=>ramp(N>1?0.15+0.85*i/(N-1):.6,'a');
  const ff=D.mu*S.mass*9.81;
  $('dynSum').innerHTML=t('dyn.sum',{m:(S.mass*1e3).toFixed(2),R:S.R.toFixed(2),L:(S.L*1e3).toFixed(2),ff:(ff*1e3).toFixed(1),n:S.n,p:(S.pitch*1e3).toFixed(1),bore:(2*S.r*1e3).toFixed(2),dm:(2*S.rMag*1e3).toFixed(2),lm:(S.lm*1e3).toFixed(2)});
  const vlab=r=>`${r.V} V → ${r.Iss.toFixed(2)} A${r.cc?' ('+t('dyn.cc')+')':''}`;
  $('dynLeg').innerHTML=legendHTML(D.runs.map((r,i)=>({color:col(i),label:vlab(r)})).concat([{color:'#a83232',dash:true,label:t('dl.fric')}]));
  // static thrust vs position for the first move
  const x0=S.xc[0]-S.pitch,x1=S.xc[S.n-1]+S.pitch,xs=[];for(let i=0;i<=600;i++)xs.push(x0+(x1-x0)*i/600);
  const S1=D.runs.map((r,i)=>({x:xs.map(x=>x*1e3),y:xs.map(x=>{let F=0;
      if(D.mode==='step')F=interp(S.prof,x-S.xc[1]);
      else{let ah=-1,bh=-1;for(let k=0;k<S.n;k++){if(S.xc[k]>x+1e-9&&(ah<0||S.xc[k]<S.xc[ah]))ah=k;if(S.xc[k]<=x+1e-9&&(bh<0||S.xc[k]>S.xc[bh]))bh=k;}
        if(ah<0)F=interp(S.prof,x-S.xc[S.n-1]);else{F=interp(S.prof,x-S.xc[ah]);if(D.mode==='pushpull'&&bh>=0)F-=interp(S.prof,x-S.xc[bh]);}}
      return F*r.Iss;}),color:col(i),label:vlab(r)}));
  S1.push({x:[x0*1e3,x1*1e3],y:[ff,ff],color:'#a83232',dash:true,label:t('dl.fric')});
  plot($('d1'),S1,t('dx.pos'),t('dy.force'),{yzero:true,xfmt:x=>x.toFixed(1)+' mm',yfmt:y=>y.toFixed(3)+' N'});
  const first=$('dynWin').value==='first',tl=first?0.15:Infinity,sc=first?1e3:1,xl=first?t('dx.tms'):t('dx.ts');
  const ser=(j,f)=>D.runs.map((r,i)=>{const L=r.log.filter(q=>q[0]<=tl),st=Math.max(1,Math.ceil(L.length/2500)),x=[],y=[];for(let k=0;k<L.length;k+=st){x.push(L[k][0]*sc);y.push(f(L[k][j]));}return{x,y,color:col(i),label:r.V+' V'};});
  const tf=first?(v=>v.toFixed(1)+' ms'):(v=>v.toFixed(3)+' s');
  plot($('d2'),ser(1,v=>v*1e3),xl,t('dy.pos'),{xfmt:tf,yfmt:y=>y.toFixed(2)+' mm'});
  plot($('d3'),ser(2,v=>v),xl,t('dy.v'),{yzero:true,xfmt:tf,yfmt:y=>y.toFixed(3)+' m/s'});
  plot($('d4'),ser(3,v=>v/9.81),xl,t('dy.a'),{yzero:true,xfmt:tf,yfmt:y=>y.toFixed(1)+' g'});
  plot($('d5'),ser(5,v=>v),xl,t('dy.I'),{y0:true,xfmt:tf,yfmt:y=>y.toFixed(3)+' A'});
  const f2=(v,d)=>isFinite(v)?v.toFixed(d):'—';
  $('dynTbl').querySelector('tbody').innerHTML=D.runs.map(r=>`<tr><td>${r.V} V${r.cc?' · '+t('dyn.cc'):''}</td><td>${f2(r.Iss,2)}</td><td>${f2(r.peak,2)}</td><td>${f2(r.startF*1e3,0)}</td><td>${f2(r.Fa,2)}</td><td>${f2(r.aa/9.81,1)}</td><td>${f2(r.tc*1e3,1)}</td><td>${f2(r.vmax,2)}</td><td>${f2(r.xo*1e3,1)}</td><td>${r.complete?f2(r.settle*1e3,0):t('dyn.nost')}</td><td>${f2(r.E,2)}</td><td>${f2(r.P,1)}</td></tr>`).join('');
}
for(const id of['d1','d2','d3','d4','d5'])attachHover($(id));
$('dynRun').addEventListener('click',runDyn);
$('dynWin').addEventListener('change',()=>{if(DYN)drawDyn();});
applyPreset('bench');
applyLang();
</script>
